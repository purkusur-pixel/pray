# namaz.sporyazilimlari.com.tr  ->  127.0.0.1:__PORT__ (Docker konteyneri)
# kurulum.sh bu dosyayı /etc/nginx/conf.d/namaz.conf olarak kopyalar ve
# __PORT__ / __CERT__ / __KEY__ değerlerini doldurur.

server {
    listen 80;
    server_name namaz.sporyazilimlari.com.tr;

    # Let's Encrypt yenilemeleri için
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name namaz.sporyazilimlari.com.tr;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_types application/json application/javascript text/javascript text/css application/manifest+json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
